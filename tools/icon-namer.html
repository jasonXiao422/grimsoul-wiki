<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Grim Soul 图标批量工具</title>
<style>
:root{--bg:#131416;--panel:#1b1d21;--border:#2c2f35;--text:#d8d4cc;--dim:#8a8579;--accent:#c9a227;--ok:#5aa15a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 24px;z-index:10}
h1{margin:0 0 4px;font-size:20px;font-weight:600}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{background:var(--accent);color:#131416;border:0;padding:8px 16px;border-radius:6px;font-weight:600;cursor:pointer;font-size:14px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
button:disabled{opacity:.4;cursor:not-allowed}
select,input{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:14px}
.stat{color:var(--dim);font-size:13px;margin-left:auto}
.stat b{color:var(--accent)}
main{padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;transition:.15s}
.card.over{border-color:var(--accent);background:#22242a}
.card.done{border-color:var(--ok)}
.drop{height:96px;border:1px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;cursor:pointer;overflow:hidden;background:#0f1012}
.drop img{max-width:100%;max-height:100%}
.nm{margin-top:8px;font-weight:600;font-size:14px}
.fn{color:var(--dim);font-size:11px;font-family:ui-monospace,monospace;word-break:break-all;margin-top:2px}
.pr{color:var(--dim);font-size:11px;margin-top:2px}
.tick{color:var(--ok);font-size:12px;margin-top:4px}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:60px}
#bulk{margin:0 24px 8px;border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--dim);transition:.15s}
#bulk.over{border-color:var(--accent);background:#1b1d21;color:var(--text)}
#bulk b{color:var(--accent)}
#log{margin:0 24px 12px;font-size:13px;max-height:190px;overflow:auto}
#log div{padding:3px 0;border-bottom:1px solid #1e2025}
#log .ok{color:var(--ok)} #log .miss{color:#c47a5f}
.fix{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:5px}
.fix img{width:34px;height:34px;object-fit:contain;background:#0f1012;border-radius:4px}
.fix select{max-width:340px}
</style>
</head>
<body>
<header>
  <h1>Grim Soul 图标批量工具</h1>
  <div class="sub">把图片拖到对应格子里，自动压缩成 128&times;128 的 webp 并按正确文件名保存</div>
  <div class="bar">
    <button id="pick">① 选择 public/images 文件夹</button>
    <select id="cat"><option value="">全部类别</option></select>
    <input id="q" type="search" placeholder="搜索名称…" style="width:180px">
    <label style="font-size:13px;color:var(--dim)"><input type="checkbox" id="hide" style="width:auto"> 只看未完成</label>
    <span class="stat">已完成 <b id="done">0</b> / <span id="total">0</span></span>
  </div>
</header>
<div id="bulk">
  <b>批量导入</b>：把一堆图片一次拖到这里，按<b>文件名中的中文名</b>自动匹配<br>
  <span style="font-size:12px">例如 <code>铁剑.png</code>、<code>圣殿骑士剑.webp</code>、<code>01_厚布.png</code> 都能识别</span>
</div>
<div id="log"></div>
<main id="grid"></main>

$('#pick').onclick = async () => {
  if (!window.showDirectoryPicker) {
    alert('这个浏览器不支持直接写入文件夹。请用 Chrome 或 Edge 打开本页。\n（Firefox / Safari 暂不支持 File System Access API）');
    return;
  }
  try {
    const h = await window.showDirectoryPicker({ mode: 'readwrite' });
    const CATS = ['weapons','armor','armor-pieces','shields','backpacks','enemies','materials','knight-orders'];
    if (CATS.includes(h.name)) {
      alert('选错了一层。\n\n你选的是「' + h.name + '」，这是分类文件夹。\n' +
            '请选它的上一层，也就是 public/images。\n\n' +
            '（工具会自动在 images 下面建分类子文件夹）');
      return;
    }
    if (h.name !== 'images') {
      if (!confirm('你选的文件夹叫「' + h.name + '」，通常应该是 images。\n确定要继续吗？')) return;
    }
    dirHandle = h;
    $('#pick').textContent = '✓ 已连接 ' + dirHandle.name;
    $('#pick').classList.add('ghost');
  } catch(e) { /* 用户取消 */ }
};

async function saveIcon(item, file, cardEl) {
  if (!dirHandle) { alert('请先点上方按钮选择 public/images 文件夹'); return; }
  const bmp = await createImageBitmap(file);
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  // 等比缩放居中，留 2px 边距
  const s = Math.min(124 / bmp.width, 124 / bmp.height);
  const w = bmp.width * s, h = bmp.height * s;
  ctx.drawImage(bmp, (128 - w) / 2, (128 - h) / 2, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.88));

  const sub = await dirHandle.getDirectoryHandle(item.cat, { create: true });
  const fh = await sub.getFileHandle(item.id + '.webp', { create: true });
  const ws = await fh.createWritable();
  await ws.write(blob); await ws.close();

  cardEl.querySelector('.drop').innerHTML = '';
  const img = document.createElement('img'); img.src = c.toDataURL('image/webp');
  cardEl.querySelector('.drop').append(img);
  cardEl.classList.add('done');
  if (!cardEl.querySelector('.tick')) {
    const t = document.createElement('div'); t.className = 'tick';
    t.textContent = '✓ 已保存 ' + Math.round(blob.size / 1024) + 'KB';
    cardEl.append(t);
  }
  doneSet.add(item.id); refreshCount();
}

function render() {
  const cat = $('#cat').value, q = $('#q').value.trim(), hide = $('#hide').checked;
  grid.innerHTML = '';
  const list = DATA.filter(d =>
    (!cat || d.catLabel === cat) &&
    (!q || d.name.includes(q) || d.id.includes(q)) &&
    (!hide || !doneSet.has(d.id))
  );
  if (!list.length) { grid.innerHTML = '<div class="empty">没有匹配的条目</div>'; return; }

  for (const item of list.slice(0, 400)) {
    const card = document.createElement('div');
    card.className = 'card' + (doneSet.has(item.id) ? ' done' : '');
    card.innerHTML = `
      <div class="drop">拖图片到这里</div>
      <div class="nm">${item.name}</div>
      ${item.parent ? `<div class="pr">${item.parent}</div>` : ''}
      <div class="fn">${item.cat}/${item.id}.webp</div>
      ${doneSet.has(item.id) ? '<div class="tick">✓ 已保存</div>' : ''}`;
    const drop = card.querySelector('.drop');

    drop.ondragover = e => { e.preventDefault(); card.classList.add('over'); };
    drop.ondragleave = () => card.classList.remove('over');
    drop.ondrop = async e => {
      e.preventDefault(); card.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) await saveIcon(item, f, card);
    };
    drop.onclick = () => {
      const i = document.createElement('input');
      i.type = 'file'; i.accept = 'image/*';
      i.onchange = () => i.files[0] && saveIcon(item, i.files[0], card);
      i.click();
    };
    // 支持直接粘贴截图
    drop.onpaste = async e => {
      const f = [...e.clipboardData.files][0];
      if (f) await saveIcon(item, f, card);
    };
    grid.append(card);
  }
  if (list.length > 400) {
    const m = document.createElement('div');
    m.className = 'empty';
    m.textContent = `还有 ${list.length - 400} 条未显示，用上方筛选缩小范围`;
    grid.append(m);
  }
}


// ---------- 批量导入 ----------
const bulk = $('#bulk'), log = $('#log');
const norm = t => t.replace(/\.[^.]+$/, '')
  .replace(/[_\-\s\d()（）\[\]]/g, '')
  .replace(/^icon|^img/i, '').trim();

function findMatch(fileName) {
  const n = norm(fileName);
  if (!n) return null;
  let hit = DATA.filter(d => d.name === n);
  if (hit.length === 1) return hit[0];
  hit = DATA.filter(d => n.includes(d.name));
  if (hit.length) return hit.sort((a, b) => b.name.length - a.name.length)[0];
  hit = DATA.filter(d => d.name.includes(n) && n.length >= 2);
  if (hit.length === 1) return hit[0];
  return null;
}

function logLine(cls, html) {
  const d = document.createElement('div');
  d.className = cls; d.innerHTML = html;
  log.prepend(d);
  return d;
}

async function saveQuiet(item, file) {
  const bmp = await createImageBitmap(file);
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const sc = Math.min(124 / bmp.width, 124 / bmp.height);
  const w = bmp.width * sc, h = bmp.height * sc;
  ctx.drawImage(bmp, (128 - w) / 2, (128 - h) / 2, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.88));
  const sub = await dirHandle.getDirectoryHandle(item.cat, { create: true });
  const fh = await sub.getFileHandle(item.id + '.webp', { create: true });
  const ws = await fh.createWritable();
  await ws.write(blob); await ws.close();
  doneSet.add(item.id);
  return blob.size;
}

bulk.ondragover = e => { e.preventDefault(); bulk.classList.add('over'); };
bulk.ondragleave = () => bulk.classList.remove('over');
bulk.ondrop = async e => {
  e.preventDefault(); bulk.classList.remove('over');
  if (!dirHandle) { alert('请先点上方按钮选择 public/images 文件夹'); return; }
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  log.innerHTML = '';
  let ok = 0, miss = 0;
  for (const f of files) {
    const m = findMatch(f.name);
    if (m) {
      try {
        const sz = await saveQuiet(m, f);
        logLine('ok', `✓ <b>${f.name}</b> → ${m.catLabel} · ${m.name} <span style="color:var(--dim)">(${Math.round(sz/1024)}KB)</span>`);
        ok++;
      } catch (err) {
        logLine('miss', `✗ <b>${f.name}</b> 写入失败：${err.message}`);
        miss++;
      }
    } else {
      miss++;
      const row = logLine('miss', `? <b>${f.name}</b> 认不出来，手动指定：`);
      const box = document.createElement('div'); box.className = 'fix';
      const img = document.createElement('img'); img.src = URL.createObjectURL(f);
      const sel = document.createElement('select');
      sel.innerHTML = '<option value="">— 选择条目 —</option>' +
        DATA.map(d => `<option value="${d.id}">${d.catLabel} · ${d.name}</option>`).join('');
      sel.onchange = async () => {
        const item = DATA.find(d => d.id === sel.value);
        if (!item) return;
        await saveQuiet(item, f);
        row.className = 'ok';
        row.innerHTML = `✓ <b>${f.name}</b> → ${item.catLabel} · ${item.name}`;
        refreshCount(); render();
      };
      box.append(img, sel); row.append(box);
    }
  }
  refreshCount(); render();
  logLine('', `<b style="color:var(--accent)">共 ${files.length} 个文件：自动匹配 ${ok} 个，需手动处理 ${miss} 个</b>`);
};

$('#cat').onchange = render; $('#hide').onchange = render;
$('#q').oninput = () => { clearTimeout(window.t); window.t = setTimeout(render, 200); };
refreshCount(); render();
</script>
