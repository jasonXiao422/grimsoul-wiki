<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grim Soul 图标工作台</title>
<style>
:root{--bg:#131416;--panel:#1b1d21;--panel2:#22242a;--border:#2c2f35;--text:#d8d4cc;--dim:#8a8579;--accent:#c9a227;--ok:#5aa15a;--warn:#c47a5f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
header{border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;background:var(--bg);z-index:20}
h1{margin:0 0 3px;font-size:19px;font-weight:600}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{background:var(--accent);color:#131416;border:0;padding:7px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
button.sm{padding:4px 10px;font-size:12px}
button:disabled{opacity:.4;cursor:not-allowed}
select,input[type=search],input[type=text]{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:14px;font-family:inherit}
label.sl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);white-space:nowrap}
input[type=range]{width:110px}
.stat{color:var(--dim);font-size:13px;margin-left:auto}
.stat b{color:var(--accent)}

#opts{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:14px 20px 0;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
#opts .grp{display:flex;gap:9px;align-items:center;padding-right:20px;border-right:1px solid var(--border)}
#opts .grp:last-child{border:0}
#opts b{font-size:12px;color:var(--text)}

main{padding:16px 20px 60px}
#drop{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--dim);transition:.15s;cursor:pointer;margin-bottom:16px}
#drop.over{border-color:var(--accent);background:var(--panel);color:var(--text)}
#drop b{color:var(--accent)}

#stage{display:none;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px}
.cmp{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.pv{text-align:center}
.pv .lb{font-size:11px;color:var(--dim);margin-bottom:5px}
.chk{background:repeating-conic-gradient(#2a2c31 0% 25%,#1e2024 0% 50%) 50%/16px 16px;border:1px solid var(--border);border-radius:8px;display:inline-block}
.chk canvas,.chk img{display:block;border-radius:7px}
.assign{flex:1;min-width:260px}
.assign .row{display:flex;gap:8px;margin-top:8px}
.assign select{flex:1}
.hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.7}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:11px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px;text-align:center;transition:.15s}
.card.over{border-color:var(--accent);background:var(--panel2)}
.card.done{border-color:var(--ok)}
.slot{height:86px;border:1px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;cursor:pointer;overflow:hidden;background:repeating-conic-gradient(#232529 0% 25%,#1a1c20 0% 50%) 50%/12px 12px}
.slot img{max-width:100%;max-height:100%}
.nm{margin-top:7px;font-weight:600;font-size:14px}
.fn{color:var(--dim);font-size:10px;font-family:ui-monospace,monospace;word-break:break-all;margin-top:2px}
.pr{color:var(--dim);font-size:10px}
.tick{color:var(--ok);font-size:11px;margin-top:3px}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:44px}
#log{margin-bottom:14px;font-size:13px;max-height:170px;overflow:auto}
#log div{padding:3px 0;border-bottom:1px solid #1e2025}
#log .ok{color:var(--ok)} #log .miss{color:var(--warn)}
.fix{display:flex;gap:8px;align-items:center;margin-top:5px}
.fix img{width:32px;height:32px;object-fit:contain;background:#0f1012;border-radius:4px}
.fix select{max-width:320px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>图标工作台</h1>
  <div class="sub">自动去背、裁切留白、补成正方形，再按中文名分配到对应文件夹</div>
  <div class="bar">
    <button id="pick">① 选择 public/images 文件夹</button>
    <select id="cat"><option value="">全部类别</option></select>
    <input id="q" type="search" placeholder="搜索名称…" style="width:150px">
    <label class="sl"><input type="checkbox" id="hide" style="width:auto"> 只看未完成</label>
    <span class="stat">已完成 <b id="done">0</b> / <span id="total">0</span></span>
  </div>
</header>

<div id="opts">
  <div class="grp">
    <b>去背</b>
    <label class="sl"><input type="checkbox" id="rmbg" checked style="width:auto"> 启用</label>
    <label class="sl">容差 <input type="range" id="tol" min="5" max="90" value="32"><span id="tolv">32</span></label>
  </div>
  <div class="grp">
    <b>裁切</b>
    <label class="sl"><input type="checkbox" id="trim" checked style="width:auto"> 去除留白</label>
    <label class="sl">边距 <input type="range" id="pad" min="0" max="20" value="6"><span id="padv">6</span>%</label>
  </div>
  <div class="grp">
    <b>输出</b>
    <label class="sl">尺寸 <select id="size"><option>128</option><option>192</option><option>256</option></select></label>
    <label class="sl">质量 <input type="range" id="qual" min="60" max="95" value="88"><span id="qualv">88</span></label>
  </div>
</div>

<main>
  <div id="drop">
    <b>把图片拖到这里</b>　单张会先进预览台，多张则按文件名批量分配<br>
    <span style="font-size:12px">支持 png / jpg / webp，任意尺寸</span>
  </div>

  <div id="stage">
    <div class="cmp">
      <div class="pv"><div class="lb">原图</div><div class="chk"><canvas id="cvA"></canvas></div></div>
      <div class="pv"><div class="lb">处理后</div><div class="chk"><canvas id="cvB"></canvas></div></div>
      <div class="assign">
        <div style="font-size:13px"><span id="fname" style="color:var(--accent)"></span></div>
        <div class="row">
          <select id="target"></select>
          <button id="save">保存</button>
        </div>
        <div class="row">
          <button class="ghost sm" id="reproc">重新处理</button>
          <button class="ghost sm" id="skip">取消</button>
        </div>
        <div class="hint" id="info"></div>
      </div>
    </div>
  </div>

  <div id="log"></div>
  <div id="grid"></div>
</main>

const CATS_DIR = ['weapons','armor','armor-pieces','shields','backpacks','amulets','enemies','materials','knight-orders'];

const doneSet = new Set(JSON.parse(localStorage.getItem('gs-done') || '[]'));

const grid = $('#grid'), log = $('#log');

['tol','pad','qual'].forEach(k => {

});
['rmbg','trim','size'].forEach(k => $('#'+k).onchange = () => { if (current) process(); });

// ================= 图像处理 =================

/** 边缘泛洪：从四边向内蔓延，把与边缘色接近的像素抹成透明 */
function removeBg(img, tol) {
  const { width: w, height: h, data: d } = img;
  const seen = new Uint8Array(w * h);
  const stack = [];
  const samples = [];

  const at = (x, y) => (y * w + x) * 4;
  // 采样四条边的颜色作为背景基准
  for (let x = 0; x < w; x += Math.max(1, (w / 40) | 0)) {
    samples.push([d[at(x,0)], d[at(x,0)+1], d[at(x,0)+2]]);
    samples.push([d[at(x,h-1)], d[at(x,h-1)+1], d[at(x,h-1)+2]]);
  }
  for (let y = 0; y < h; y += Math.max(1, (h / 40) | 0)) {
    samples.push([d[at(0,y)], d[at(0,y)+1], d[at(0,y)+2]]);
    samples.push([d[at(w-1,y)], d[at(w-1,y)+1], d[at(w-1,y)+2]]);
  }
  const base = samples.reduce((a, s) => [a[0]+s[0], a[1]+s[1], a[2]+s[2]], [0,0,0]).map(v => v / samples.length);

  const near = i => {
    const dr = d[i]-base[0], dg = d[i+1]-base[1], db = d[i+2]-base[2];
    return Math.sqrt(dr*dr + dg*dg + db*db) <= tol * 2.55 * 1.6;
  };

  for (let x = 0; x < w; x++) { stack.push(x, 0); stack.push(x, h-1); }
  for (let y = 0; y < h; y++) { stack.push(0, y); stack.push(w-1, y); }

  while (stack.length) {
    const y = stack.pop(), x = stack.pop();
    if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const p = y * w + x;
    if (seen[p]) continue;
    const i = p * 4;
    if (!near(i)) continue;
    seen[p] = 1; d[i+3] = 0;
    stack.push(x+1, y, x-1, y, x, y+1, x, y-1);
  }

  // 边缘羽化：半透明处理紧邻透明区的像素，避免锯齿和残留描边
  const copy = new Uint8ClampedArray(d);
  for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) {
    const p = y*w+x, i = p*4;
    if (copy[i+3] === 0) continue;
    let clear = 0;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) if (copy[((y+dy)*w+(x+dx))*4+3] === 0) clear++;
    if (clear) d[i+3] = Math.round(copy[i+3] * (1 - clear * 0.22));
  }
  return img;
}

/** 找出不透明内容的外接矩形 */
function bounds(img, alphaMin = 12) {
  const { width: w, height: h, data: d } = img;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[(y*w+x)*4+3] > alphaMin) {
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  return x1 < 0 ? null : { x: x0, y: y0, w: x1-x0+1, h: y1-y0+1 };
}

async function process() {
  if (!current) return;
  const bmp = current.bmp;
  const size = +$('#size').value, padPct = +$('#pad').value / 100;

  // 原图预览
  const a = $('#cvA'), sc = Math.min(150/bmp.width, 150/bmp.height, 1);
  a.width = Math.round(bmp.width*sc); a.height = Math.round(bmp.height*sc);
  a.getContext('2d').drawImage(bmp, 0, 0, a.width, a.height);

  // 全尺寸工作画布
  const wc = document.createElement('canvas');
  wc.width = bmp.width; wc.height = bmp.height;
  const wx = wc.getContext('2d', { willReadFrequently: true });
  wx.drawImage(bmp, 0, 0);
  let img = wx.getImageData(0, 0, wc.width, wc.height);

  if ($('#rmbg').checked) img = removeBg(img, +$('#tol').value);
  wx.putImageData(img, 0, 0);

  let box = { x:0, y:0, w:wc.width, h:wc.height };
  if ($('#trim').checked) box = bounds(img) || box;

  // 输出为正方形，内容居中
  const b = $('#cvB'); b.width = b.height = size;
  const bx = b.getContext('2d');
  bx.clearRect(0, 0, size, size);
  bx.imageSmoothingQuality = 'high';
  const avail = size * (1 - padPct * 2);
  const s = Math.min(avail / box.w, avail / box.h);
  const dw = box.w * s, dh = box.h * s;
  bx.drawImage(wc, box.x, box.y, box.w, box.h, (size-dw)/2, (size-dh)/2, dw, dh);

  const blob = await new Promise(r => b.toBlob(r, 'image/webp', +$('#qual').value / 100));
  current.blob = blob;
  $('#info').innerHTML =
    `原图 ${bmp.width}×${bmp.height}　→　内容区 ${box.w}×${box.h}　→　输出 ${size}×${size}<br>` +
    `体积 <b style="color:var(--accent)">${(blob.size/1024).toFixed(1)}KB</b>　` +
    ($('#rmbg').checked ? '已去背，若边缘残留请调高容差；抠掉了主体则调低' : '未去背');
}

async function write(item, blob) {
  const sub = await dirHandle.getDirectoryHandle(item.cat, { create: true });
  const fh = await sub.getFileHandle(item.id + '.webp', { create: true });
  const ws = await fh.createWritable(); await ws.write(blob); await ws.close();
  doneSet.add(item.id);
}

// ---------- 单张：进预览台
async function stageOne(file, presetId) {
  current = { file, bmp: await createImageBitmap(file) };
  $('#stage').style.display = 'block';
  $('#fname').textContent = file.name;
  $('#target').value = presetId || guess(file.name)?.id || '';
  await process();
  $('#stage').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

$('#save').onclick = async () => {
  if (!dirHandle) { alert('请先点上方按钮选择 public/images 文件夹'); return; }
  const item = DATA.find(d => d.id === $('#target').value);
  if (!item) { alert('请先选择要保存到哪个条目'); return; }
  await write(item, current.blob);
  $('#stage').style.display = 'none'; current = null;
  refresh(); render();
};
$('#skip').onclick = () => { $('#stage').style.display = 'none'; current = null; };
$('#reproc').onclick = process;

// ---------- 批量：按文件名猜条目
const norm = t => t.replace(/\.[^.]+$/, '').replace(/[_\-\s\d()（）\[\]]/g, '').replace(/^icon|^img/i, '').trim();
function guess(fileName) {
  const n = norm(fileName);
  if (!n) return null;
  let hit = DATA.filter(d => d.name === n);
  if (hit.length === 1) return hit[0];
  hit = DATA.filter(d => n.includes(d.name));
  if (hit.length) return hit.sort((a,b) => b.name.length - a.name.length)[0];
  hit = DATA.filter(d => d.name.includes(n) && n.length >= 2);
  if (hit.length === 1) return hit[0];
  return null;
}

async function autoProcess(file) {
  const bmp = await createImageBitmap(file);
  const size = +$('#size').value, padPct = +$('#pad').value / 100;
  const wc = document.createElement('canvas');
  wc.width = bmp.width; wc.height = bmp.height;
  const wx = wc.getContext('2d', { willReadFrequently: true });
  wx.drawImage(bmp, 0, 0);
  let img = wx.getImageData(0, 0, wc.width, wc.height);
  if ($('#rmbg').checked) img = removeBg(img, +$('#tol').value);
  wx.putImageData(img, 0, 0);
  let box = { x:0, y:0, w:wc.width, h:wc.height };
  if ($('#trim').checked) box = bounds(img) || box;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const cx = c.getContext('2d');
  cx.imageSmoothingQuality = 'high';
  const avail = size * (1 - padPct * 2), s = Math.min(avail/box.w, avail/box.h);
  const dw = box.w*s, dh = box.h*s;
  cx.drawImage(wc, box.x, box.y, box.w, box.h, (size-dw)/2, (size-dh)/2, dw, dh);
  return { blob: await new Promise(r => c.toBlob(r, 'image/webp', +$('#qual').value/100)), url: c.toDataURL('image/webp') };
}

async function batch(files) {
  if (!dirHandle) { alert('请先点上方按钮选择 public/images 文件夹'); return; }
  log.innerHTML = ''; let ok = 0, miss = 0;
  for (const f of files) {
    const m = guess(f.name);
    const r = await autoProcess(f);
    if (m) {
      await write(m, r.blob);
      const d = document.createElement('div'); d.className = 'ok';
      d.innerHTML = `✓ <b>${f.name}</b> → ${m.catLabel} · ${m.name} <span style="color:var(--dim)">(${Math.round(r.blob.size/1024)}KB)</span>`;
      log.prepend(d); ok++;
    } else {
      miss++;
      const row = document.createElement('div'); row.className = 'miss';
      row.innerHTML = `? <b>${f.name}</b> 认不出来，手动指定：`;
      const box = document.createElement('div'); box.className = 'fix';
      const im = document.createElement('img'); im.src = r.url;
      const sel = document.createElement('select');
      sel.innerHTML = '<option value="">— 选择条目 —</option>' + DATA.map(d => `<option value="${d.id}">${d.catLabel} · ${d.name}</option>`).join('');
      sel.onchange = async () => {
        const it = DATA.find(d => d.id === sel.value); if (!it) return;
        await write(it, r.blob);
        row.className = 'ok'; row.innerHTML = `✓ <b>${f.name}</b> → ${it.catLabel} · ${it.name}`;
        refresh(); render();
      };
      box.append(im, sel); row.append(box); log.prepend(row);
    }
  }
  refresh(); render();
  const s = document.createElement('div');
  s.innerHTML = `<b style="color:var(--accent)">共 ${files.length} 张：自动匹配 ${ok}，需手动 ${miss}</b>`;
  log.prepend(s);
}

// ---------- 拖放入口
const drop = $('#drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = async e => {
  e.preventDefault(); drop.classList.remove('over');
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  files.length === 1 ? stageOne(files[0]) : batch(files);
};
drop.onclick = () => {
  const i = document.createElement('input'); i.type='file'; i.accept='image/*'; i.multiple=true;
  i.onchange = () => { const f=[...i.files]; f.length===1 ? stageOne(f[0]) : batch(f); };
  i.click();
};

// ---------- 条目网格
function render() {
  const cat = $('#cat').value, q = $('#q').value.trim(), hide = $('#hide').checked;
  grid.innerHTML = '';
  const list = DATA.filter(d => (!cat || d.catLabel === cat) && (!q || d.name.includes(q) || d.id.includes(q)) && (!hide || !doneSet.has(d.id)));
  if (!list.length) { grid.innerHTML = '<div class="empty">没有匹配的条目</div>'; return; }
  for (const item of list.slice(0, 400)) {
    const card = document.createElement('div');
    card.className = 'card' + (doneSet.has(item.id) ? ' done' : '');
    card.innerHTML = `<div class="slot">拖图片到这里</div><div class="nm">${item.name}</div>${item.parent?`<div class="pr">${item.parent}</div>`:''}<div class="fn">${item.cat}/${item.id}.webp</div>${doneSet.has(item.id)?'<div class="tick">✓ 已保存</div>':''}`;
    const slot = card.querySelector('.slot');
    slot.ondragover = e => { e.preventDefault(); card.classList.add('over'); };
    slot.ondragleave = () => card.classList.remove('over');
    slot.ondrop = async e => {
      e.preventDefault(); card.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) await stageOne(f, item.id);
    };
    slot.onclick = () => {
      const i = document.createElement('input'); i.type='file'; i.accept='image/*';
      i.onchange = () => i.files[0] && stageOne(i.files[0], item.id);
      i.click();
    };
    grid.append(card);
  }
  if (list.length > 400) {
    const m = document.createElement('div'); m.className='empty';
    m.textContent = `还有 ${list.length-400} 条未显示，用上方筛选缩小范围`;
    grid.append(m);
  }
}
$('#cat').onchange = render; $('#hide').onchange = render;
$('#q').oninput = () => { clearTimeout(window.t); window.t = setTimeout(render, 200); };
refresh(); render();
